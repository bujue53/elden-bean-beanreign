name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check js/game.js
      - run: node --check js/nightfarers.js
      - run: node --check tests/browser-smoke.js
      - run: node --check tests/playthrough.js
      - run: node --check tests/combat-features.js
      - run: node --check tests/record-execution.js
      - run: node --check desktop/main.cjs
      - run: node --check desktop/smoke.cjs
      - run: node --check tools/build-windows.cjs
